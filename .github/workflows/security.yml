name: GTM Security Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  secrets-scan:
    name: No secrets in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for obvious secrets
        run: |
          set -e
          if grep -RInE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude='*.md' . ; then
            echo "Possible secret pattern found"
            exit 1
          fi
          echo "No obvious secret patterns"
