# GitHub Action Machine (GTM) — direct GitHub Actions build engine.
# The source upload lives on a temporary branch in a PRIVATE runner repository.
name: GTM User Build
run-name: GTM Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'GTM Build ID'
        required: true
        type: string
      source_ref:
        description: 'Temporary private branch containing source.zip'
        required: true
        type: string
      profile:
        description: 'Build profile (auto, node, java-gradle, ...)'
        required: true
        default: 'auto'
        type: string
      custom_command:
        description: 'Optional build command (runs as untrusted code)'
        required: false
        default: ''
        type: string
      timeout_minutes:
        description: 'Timeout minutes (5–120)'
        required: true
        default: '30'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gtm-build-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.build_id }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '30') }}
    env:
      BUILD_ID: ${{ inputs.build_id }}
      PROFILE: ${{ inputs.profile }}
      CUSTOM_COMMAND: ${{ inputs.custom_command }}
      WORK: ${{ runner.temp }}/gtm-work
    steps:
      - name: Checkout trusted runner repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout temporary source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: gtm-source-upload
          persist-credentials: false

      - name: Validate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/src" "$WORK/out/artifacts"
          test -f "gtm-source-upload/source.zip" || { echo "Source ZIP missing from temporary branch"; exit 1; }
          # Reject unsafe archive paths before extraction.
          if unzip -Z1 "gtm-source-upload/source.zip" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in ZIP; refusing extraction"; exit 1
          fi
          unzip -q "gtm-source-upload/source.zip" -d "$WORK/src"
          echo "Source extracted to temporary runner workspace."

      - name: Detect project and run build
        shell: bash
        run: |
          set -uo pipefail
          SRC="$WORK/src"
          OUT="$WORK/out"
          cd "$SRC"

          detect() {
            if [ -f gradlew ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
              if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
                grep -Rqs 'com.android.application\|com.android.library' --include='*.gradle' --include='*.gradle.kts' . && { echo android; return; }
              fi
              echo java-gradle
            elif [ -f pom.xml ] || [ -f mvnw ]; then echo java-maven
            elif [ -f package.json ]; then echo node
            elif [ -f go.mod ]; then echo go
            elif [ -f Cargo.toml ]; then echo rust
            elif [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then echo python
            elif [ -f composer.json ]; then echo php
            elif compgen -G '*.sln' >/dev/null || compgen -G '*.csproj' >/dev/null; then echo dotnet
            elif [ -f CMakeLists.txt ] || [ -f Makefile ]; then echo cmake
            else echo unknown; fi
          }

          DETECTED="$(detect)"
          if [ "$PROFILE" != auto ]; then DETECTED="$PROFILE"; fi
          echo "Detected project profile: $DETECTED"
          printf 'project_type=%s\n' "$DETECTED" > "$OUT/meta.env"
          run_build() {
            local cmd="$1"
            echo "$ $cmd"
            set +e
            bash -lc "$cmd" 2>&1 | tee -a "$OUT/build.log"
            local ec=${PIPESTATUS[0]}
            set -e
            echo "$ec" > "$OUT/exit_code.txt"
            return "$ec"
          }

          SUCCESS=0
          if [ -n "$CUSTOM_COMMAND" ]; then
            run_build "$CUSTOM_COMMAND" || SUCCESS=$?
          else
          case "$DETECTED" in
            node)
              if [ -f pnpm-lock.yaml ]; then corepack enable && corepack prepare pnpm@latest --activate && run_build 'pnpm install --frozen-lockfile && pnpm run build' || SUCCESS=$?
              elif [ -f yarn.lock ]; then corepack enable && run_build 'yarn install --frozen-lockfile && yarn build' || SUCCESS=$?
              else run_build 'npm ci || npm install; npm run build --if-present' || SUCCESS=$?; fi ;;
            java-gradle|android)
              chmod +x gradlew 2>/dev/null || true
              if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build './gradlew --no-daemon build' || SUCCESS=$?; fi ;;
            java-maven)
              if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build 'mvn -B -DskipTests package' || SUCCESS=$?; fi ;;
            python)
              if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build 'python3 -m pip install -U pip && if [ -f requirements.txt ]; then pip install -r requirements.txt; fi && python3 -m compileall -q .' || SUCCESS=$?; fi ;;
            go) if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build 'go build ./...' || SUCCESS=$?; fi ;;
            rust) if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build 'cargo build --release' || SUCCESS=$?; fi ;;
            php) if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build 'composer install --no-interaction --prefer-dist' || SUCCESS=$?; fi ;;
            dotnet) if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build 'dotnet restore && dotnet build -c Release' || SUCCESS=$?; fi ;;
            cmake) if [ -n "$CUSTOM_COMMAND" ]; then run_build "$CUSTOM_COMMAND" || SUCCESS=$?; else run_build 'cmake -S . -B build && cmake --build build --config Release' || SUCCESS=$?; fi ;;
            custom) if [ -z "$CUSTOM_COMMAND" ]; then echo 'Custom profile requires a build command.' | tee -a "$OUT/build.log"; SUCCESS=1; else run_build "$CUSTOM_COMMAND" || SUCCESS=$?; fi ;;
            *) echo "Unsupported project profile: $DETECTED. Choose a supported profile or provide a custom command." | tee -a "$OUT/build.log"; SUCCESS=2 ;;
          esac
          fi
          echo "$SUCCESS" > "$OUT/exit_code.txt"
          if [ "$SUCCESS" -eq 0 ]; then echo success > "$OUT/conclusion.txt"; else echo failure > "$OUT/conclusion.txt"; fi
          exit "$SUCCESS"

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          SRC="$WORK/src"
          OUT="$WORK/out"
          mkdir -p "$OUT/artifacts"
          find "$SRC" -type f \( -name '*.jar' -o -name '*.war' -o -name '*.apk' -o -name '*.aab' -o -name '*.whl' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.exe' -o -name '*.dll' -o -name '*.so' -o -name '*.zip' \) ! -path '*/node_modules/*' ! -path '*/.git/*' 2>/dev/null | head -50 | while IFS= read -r f; do cp -n "$f" "$OUT/artifacts/" 2>/dev/null || true; done
          if [ -d "$SRC/dist" ]; then tar -czf "$OUT/artifacts/dist.tar.gz" -C "$SRC" dist || true; fi
          find "$OUT" -maxdepth 2 -type f -printf '%p (%s bytes)\n' || true

      - name: Upload build outputs as GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtm-${{ inputs.build_id }}
          path: ${{ runner.temp }}/gtm-work/out/**
          if-no-files-found: warn
          retention-days: 7


  cleanup:
    name: Delete temporary source branch
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete temporary source branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'heads/' + ${{ toJSON(inputs.source_ref) }};
            try {
              await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref });
              core.info(`Deleted temporary source branch ${ref}`);
            } catch (error) {
              core.warning(`Could not delete temporary source branch ${ref}: ${error.message}`);
            }
